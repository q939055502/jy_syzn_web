<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 64" width="460" height="64">
  <!-- 左侧小三角（与气泡无缝衔接，原SVG绿色#9eea6a） -->
  <polygon points="0,32 20,16 20,48" fill="#9eea6a"/>
  <!-- 气泡主体（刚好包裹文字，圆角适配，无多余空隙） -->
  <rect x="20" y="0" width="440" height="64" rx="32" ry="32" fill="#9eea6a"/>
  <!-- 文字：极致兼容写法，仅保留解析器必认的基础属性 -->
  <text x="250" y="32" text-anchor="middle" dy="0.2em"
        font-family="SimSun, Arial" font-size="36" fill="#333">
    ＜＜＜请点击分类导航
  </text>
</svg>